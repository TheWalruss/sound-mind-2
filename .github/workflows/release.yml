name: Release

on:
  push:
    tags: ['v*']

env:
  QT_VERSION: 6.8.3

permissions:
  contents: write

jobs:
  build-package:
    name: Build & Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            msvc_arch: x64
            ninja_platform: win
            qt_host_pkg: ""
            qt_target_pkg: win64_msvc2022_64
            qt_root_dir: C:/Qt/6.8.3/msvc2022_64
            qt_host_path_dir: ""
            asset_name: windows-x64
          - name: Windows ARM64
            runner: windows-11-arm
            msvc_arch: arm64
            ninja_platform: winarm64
            qt_host_pkg: win64_msvc2022_64
            qt_target_pkg: win64_msvc2022_arm64_cross_compiled
            qt_root_dir: C:/Qt/6.8.3/msvc2022_arm64
            qt_host_path_dir: C:/Qt/6.8.3/msvc2022_64
            asset_name: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          platform: ${{ matrix.ninja_platform }}

      - name: Clone & bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      # Same reasoning as ci.yml's identical step - without it, every
      # release build rebuilds every dependency (including ffmpeg, ~15-17
      # minutes on its own) from source.
      # Restore-only. The key carries run_id so it never exact-matches a
      # previous run: an exact hit is never re-saved, which previously froze
      # the cache at its first (Sept 8) contents. After a runner-image
      # compiler update vcpkg's ABI hashes changed, every package missed
      # ("Restored 0 package(s)"), and the stale entry kept being restored
      # without ever being refreshed - so Configure rebuilt everything
      # (20-30 min) on every run. restore-keys still finds the newest entry.
      - name: Restore vcpkg binary cache
        id: vcpkg-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ matrix.name }}-

      - name: Install aqtinstall
        shell: pwsh
        run: pip install aqtinstall

      - name: Install Qt host tools (Arm64 job only)
        if: matrix.qt_host_pkg != ''
        shell: pwsh
        run: python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ matrix.qt_host_pkg }} --outputdir C:/Qt

      - name: Install Qt
        shell: pwsh
        run: python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ matrix.qt_target_pkg }} --outputdir C:/Qt --modules qtimageformats

      # Needed before Configure below, not just before Package: the
      # top-level CMakeLists.txt's `docs` target is only ever created if
      # `find_package(Doxygen)` succeeds at *configure* time - installing
      # Doxygen after configuring would leave that target undefined, and
      # `sound-mind-studio/CMakeLists.txt`'s own install(DIRECTORY
      # docs/generated-user-docs/html/ ...) rule fails outright at
      # `cmake --install` if that directory was never generated (confirmed
      # by `v0.0.45.2`'s own real failed release run, 2026-09-21 - see that
      # file's own updated comment on the rule).
      - name: Install Doxygen
        shell: pwsh
        run: |
          choco install doxygen.install -y --no-progress
          # A step's own PATH is a snapshot taken at job start, not a live
          # read of the registry Chocolatey just updated - without this,
          # find_package(Doxygen) below wouldn't see the new install until
          # (never, within this same job). Located dynamically, rather than
          # assuming the installer's default directory, so a Chocolatey
          # packaging change fails loudly here instead of surfacing later
          # as a confusing "target 'docs' not found".
          $doxygenExe = Get-ChildItem "C:\Program Files\doxygen" -Recurse -Filter doxygen.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $doxygenExe) {
            throw "doxygen.exe not found after 'choco install doxygen.install' - installer layout may have changed."
          }
          echo $doxygenExe.DirectoryName >> $env:GITHUB_PATH

      - name: Configure (Release)
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-binary-cache
          QT_ROOT_DIR: ${{ matrix.qt_root_dir }}
          QT_HOST_PATH_DIR: ${{ matrix.qt_host_path_dir }}
          # The MSIX package identity, once the app name is reserved in Partner
          # Center (docs/store-submission.md) - repository variables; unset,
          # the CMake defaults (fine for local testing only) apply.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}\vcpkg-binary-cache" | Out-Null
          $msixArgs = @()
          if ($env:MSIX_IDENTITY_NAME) { $msixArgs += "-DSOUND_MIND_MSIX_IDENTITY_NAME=$env:MSIX_IDENTITY_NAME" }
          if ($env:MSIX_PUBLISHER) { $msixArgs += "-DSOUND_MIND_MSIX_PUBLISHER=$env:MSIX_PUBLISHER" }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $msixArgs += "-DSOUND_MIND_MSIX_PUBLISHER_DISPLAY_NAME=$env:MSIX_PUBLISHER_DISPLAY_NAME" }
          cmake --preset release @msixArgs

      # Saved straight after Configure, even if a later step fails or times
      # out - a post-job save is skipped on failure, which kept the cache
      # permanently cold whenever a run was cancelled at the timeout.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build sound-mind-studio (Release)
        shell: pwsh
        run: cmake --build --preset release --target sound-mind-studio

      # Required before Package below - see sound-mind-studio/CMakeLists.txt's
      # own install(DIRECTORY docs/generated-user-docs/html/ ...) rule docs.
      - name: Build docs
        shell: pwsh
        run: cmake --build --preset release --target docs

      # Uses `cmake --install` rather than a hand-rolled Copy-Item +
      # windeployqt sequence of its own - sound-mind-studio/CMakeLists.txt's
      # own install() rules (its own "Packaging" comment explains why:
      # `cmake --install` is meant to be the *one* place this logic lives,
      # so `cpack -G ZIP`/`cpack -G WIX` and this manual zip never drift
      # apart) already install the exe, every vcpkg-app-local third-party
      # runtime DLL (FFmpeg/libtiff/...), and Qt's own runtime via
      # windeployqt (configured during the "Configure (Release)" step
      # above, host-side-tool cross-deployment included - see that file's
      # own comments) - a second, separate copy of that same deployment
      # logic here had drifted out of sync with it and shipped an
      # incomplete `v0.0.32.1` zip/installer, missing every non-Qt runtime
      # DLL (see `docs/sound-mind-architecture.md`'s Decision on this fix).
      # windeployqt still drops in the VC++ Redistributable installer for
      # whichever CRT the build needs - not a fully app-local runtime, but
      # a normal, common way to ship a Windows exe; documented in the
      # release notes.
      - name: Package
        shell: pwsh
        run: |
          cmake --install build/release --prefix dist/sound-mind-studio
          Compress-Archive -Path "dist/sound-mind-studio/*" -DestinationPath "sound-mind-studio-${{ github.ref_name }}-${{ matrix.asset_name }}.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: sound-mind-studio-${{ matrix.asset_name }}-zip
          path: sound-mind-studio-${{ github.ref_name }}-${{ matrix.asset_name }}.zip
          if-no-files-found: error

      # WiX installer, via CMake's CPack integration (see CMakeLists.txt
      # and sound-mind-studio/CMakeLists.txt) - alongside the zip above,
      # not replacing it, per docs/sound-mind-roadmap.md's "Packaging &
      # Installers". `wix` is a dotnet global tool; its UI extension
      # version must match the tool version exactly.
      - name: Set up .NET (for WiX)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add --global WixToolset.UI.wixext/6.0.1

      - name: Package (MSI)
        shell: pwsh
        run: cmake --build --preset release --target package

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sound-mind-studio-${{ matrix.asset_name }}-msi
          path: build/release/*.msi
          if-no-files-found: error

      # The MSIX package for the Microsoft Store (v0.1.42.2) - unsigned, so
      # it's kept as a workflow artifact rather than a release asset (an
      # unsigned MSIX can't be installed outside the Store); bundle-msix
      # below combines both architectures for upload to Partner Center.
      - name: Package (MSIX)
        shell: pwsh
        run: cmake --build --preset release --target msix

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sound-mind-studio-${{ matrix.asset_name }}-msix
          path: build/release/msix/*.msix
          if-no-files-found: error

  # Both architectures' MSIX packages in one .msixbundle - what gets uploaded
  # to Partner Center for a Store submission (docs/store-submission.md). A
  # workflow artifact only; the Store signs what it distributes.
  bundle-msix:
    name: Bundle MSIX for the Store
    needs: build-package
    runs-on: windows-latest
    steps:
      - name: Download MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: sound-mind-studio-*-msix
          path: msix
          merge-multiple: true

      - name: Bundle
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.DirectoryName -like '*\x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          # Same version mapping as the packages: X.Y.Z.W -> X.Y.(Z*1000+W).0.
          $parts = "${{ github.ref_name }}".TrimStart('v').Split('.')
          $bundleVersion = "$($parts[0]).$($parts[1]).$([int]$parts[2] * 1000 + [int]$parts[3]).0"
          & $makeappx.FullName bundle /o /bv $bundleVersion /d msix /p "sound-mind-studio-${{ github.ref_name }}.msixbundle"
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed ($LASTEXITCODE)" }

      - name: Upload MSIX bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sound-mind-studio-msix-store-upload
          path: sound-mind-studio-${{ github.ref_name }}.msixbundle
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.msi
          generate_release_notes: true
          body: |
            Sound Mind Studio treats sound as a picture - encoding audio
            as a spectrogram you can import, layer, paint on, filter,
            analyze, play back, loop and record onto, then decoding it
            back into audio with no extra step. See `CHANGELOG.md` for
            exactly what's new in this build, `USER_GUIDE.md` for every
            screen and control, and `docs/sound-mind-roadmap.md` for
            what's planned next.

            Pre-release software, free to use under `LICENSE.md` (included
            in every download). Open-source components and their licences
            are listed in `THIRD_PARTY_NOTICES.md`; the source code of the
            LGPL/MPL components is in the `third-party-sources-1` release.

            Two ways to get it, per architecture: a zip you extract and
            run directly, or an `.msi` installer (built with WiX) that
            installs it properly with a Start Menu shortcut and an
            uninstaller. Both are self-contained except for the Visual
            C++ runtime: the zip includes `vc_redist.<arch>.exe` to run
            first if the app doesn't launch; the installer pulls it in
            via the same mechanism (most systems already have it either
            way).
