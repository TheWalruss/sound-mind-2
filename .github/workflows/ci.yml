name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_VERSION: 6.8.3

jobs:
  build-test:
    name: Build & Test (${{ matrix.name }})
    # Default job timeout is 6 hours - a genuine hang (rather than a normal
    # few-minute run) should fail loudly and stop burning runner time long
    # before that. ctest's own --timeout (see CMakePresets.json) should
    # already catch a hung test specifically; this is the outer safety net
    # in case something else entirely (configure, build, tooling) hangs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            msvc_arch: x64
            ninja_platform: win
            qt_host_pkg: ""
            qt_target_pkg: win64_msvc2022_64
            qt_root_dir: C:/Qt/6.8.3/msvc2022_64
            qt_host_path_dir: ""
          - name: Windows ARM64
            runner: windows-11-arm
            msvc_arch: arm64
            ninja_platform: winarm64
            # Qt ships no natively-Arm64-built host tools (moc/uic/rcc) -
            # the Arm64 target package needs the x64 desktop package
            # installed alongside it to provide those (run via Windows'
            # x64 emulation), even though the target libraries themselves
            # are native Arm64. Validated locally the same way.
            qt_host_pkg: win64_msvc2022_64
            qt_target_pkg: win64_msvc2022_arm64_cross_compiled
            qt_root_dir: C:/Qt/6.8.3/msvc2022_arm64
            qt_host_path_dir: C:/Qt/6.8.3/msvc2022_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # A freshly built .exe has a brand-new hash Defender has never seen -
      # its first execution can trigger a real-time scan that occasionally
      # takes a very long time (reproduced locally: a fresh rebuild's first
      # run of sound-mind-studio-tests.exe hit a 120s timeout, then passed
      # in <0.1s on every subsequent run of that same binary). Excluding the
      # paths that only ever contain build output/toolchain files we just
      # fetched or compiled ourselves removes that scan without disabling
      # Defender itself.
      - name: Exclude build output from Windows Defender scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "C:\Qt"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}\vcpkg"

      # windows-latest is genuine x64 hardware and windows-11-arm is genuine
      # Arm64 hardware (GitHub's Arm-partner runner, generally available for
      # public repos) - both jobs are native builds, neither is a
      # cross-compile, per tech-stack-decisions.md's Arm64-primary /
      # x64-CI-validated split, now validated natively on both.
      - name: Set up MSVC (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Neither runner image guarantees Ninja preinstalled for its
      # architecture - install it explicitly for both.
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          platform: ${{ matrix.ninja_platform }}

      - name: Clone & bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install aqtinstall
        shell: pwsh
        run: pip install aqtinstall

      - name: Install Qt host tools (Arm64 job only)
        if: matrix.qt_host_pkg != ''
        shell: pwsh
        run: python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ matrix.qt_host_pkg }} --outputdir C:/Qt

      - name: Install Qt
        shell: pwsh
        run: python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ matrix.qt_target_pkg }} --outputdir C:/Qt

      # Step-scoped `env:` (as Configure below uses for QT_ROOT_DIR) does not
      # carry forward to later steps - so without this, the Test step below
      # has no way to find Qt's DLLs (Qt6Widgetsd.dll etc) at runtime, since
      # nothing else ever puts Qt's bin directory on PATH. $GITHUB_PATH is
      # the mechanism that *does* persist across steps for the rest of the
      # job. Local dev doesn't hit this because a Developer Command Prompt
      # session normally has Qt's bin directory added to PATH directly.
      - name: Add Qt runtime to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ matrix.qt_root_dir }}/bin"

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
          QT_ROOT_DIR: ${{ matrix.qt_root_dir }}
          QT_HOST_PATH_DIR: ${{ matrix.qt_host_path_dir }}
        run: cmake --preset debug

      - name: Build
        shell: pwsh
        run: cmake --build --preset debug

      - name: Test
        shell: pwsh
        # QT_QPA_PLATFORM is also set per-test via CMake's ENVIRONMENT test
        # property (see sound-mind-studio/tests/CMakeLists.txt) - set again
        # here at the step level as defense in depth, so a GUI test can
        # never end up trying to create a real window on a runner with no
        # interactive desktop.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset debug
