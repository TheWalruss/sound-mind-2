name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            msvc_arch: x64
            ninja_platform: win
          - name: Windows ARM64
            runner: windows-11-arm
            msvc_arch: arm64
            ninja_platform: winarm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # windows-latest is genuine x64 hardware and windows-11-arm is genuine
      # Arm64 hardware (GitHub's Arm-partner runner, generally available for
      # public repos) - both jobs are native builds, neither is a
      # cross-compile, per tech-stack-decisions.md's Arm64-primary /
      # x64-CI-validated split, now validated natively on both.
      - name: Set up MSVC (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Neither runner image guarantees Ninja preinstalled for its
      # architecture - install it explicitly for both.
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          platform: ${{ matrix.ninja_platform }}

      - name: Clone & bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}\vcpkg"
          & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: cmake --preset debug

      - name: Build
        shell: pwsh
        run: cmake --build --preset debug

      - name: Test
        shell: pwsh
        run: ctest --preset debug
